<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Expense Tracker</title>

    <!-- Flowbite & Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/styles/styles.css">
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="fixed w-full z-20 top-0 start-0 bg-transparent backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="./index.html" class="flex items-center space-x-3">
                        <img class="h-16 w-auto" src="./assets/images/logo.png" alt="Logo">
                        <span class="text-2xl font-semibold text-blue-600 dark:text-black"></span>
                    </a>
                </div>
                <div class="flex space-x-8 items-center ">
                    <a href="#"
                        class="text-pink-900 hover:text-pink-600 dark:text-pink dark:hover:text-pink-600">Dashboard</a>
                    <a href="#"
                        class="text-pink-900 hover:text-pink-600 dark:text-pink dark:hover:text-pink-600">Add
                        Income</a>
                    <a href="#"
                        class="text-pink-900 hover:text-pink-600 dark:text-pink dark:hover:text-pink-600">Expense
                        List</a>
                    <a href="#"
                        class="text-pink-900 hover:text-pink-600 dark:text-pink dark:hover:text-pink-600">Categories</a>
                </div>
                <!-- Mobile menu button -->
                <div class="flex items-center md:hidden">
                    <button data-collapse-toggle="mobile-menu" type="button"
                        class="inline-flex items-center justify-center p-2 rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-100/40 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                        aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile menu -->
        <div class="md:hidden hidden bg-transparent backdrop-blur-md" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="#"
                    class="block px-3 py-2 text-gray-900 hover:bg-gray-100/30 rounded-md dark:text-white dark:hover:bg-gray-700/50">Home</a>
                <a href="#"
                    class="block px-3 py-2 text-gray-900 hover:bg-gray-100/30 rounded-md dark:text-white dark:hover:bg-gray-700/50">About</a>
                <a href="#"
                    class="block px-3 py-2 text-gray-900 hover:bg-gray-100/30 rounded-md dark:text-white dark:hover:bg-gray-700/50">Services</a>
                <a href="#"
                    class="block px-3 py-2 text-gray-900 hover:bg-gray-100/30 rounded-md dark:text-white dark:hover:bg-gray-700/50">Pricing</a>
                <a href="#"
                    class="block px-3 py-2 text-gray-900 hover:bg-gray-100/30 rounded-md dark:text-white dark:hover:bg-gray-700/50">Contact</a>
            </div>
        </div>
    </nav>


    <div class="relative max-w-6xl mx-auto my-10 px-4 pt-20">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">💰 Personal Expense Tracker</h1>

        <!-- Add Expense Form -->
        <div class="bg-white shadow-lg rounded-2xl p-6 mb-6">
            <h2 class="text-lg font-semibold text-white bg-blue-500 p-3 rounded-t-lg">Add New Expense</h2>
            <form id="expense-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4">
                <div>
                    <label for="date" class="block mb-1 font-medium text-gray-700 dark:text-black">Date</label>
                    <input type="text" id="date" placeholder="Select date"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div>
                    <label for="category" class="block mb-1 font-medium text-gray-700 dark:text-black">Category</label>
                    <div class="flex flex-col">
                        <select id="category"
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Medical">Medical</option>
                            <option value="University">University</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="text" id="other-category" placeholder="Enter custom category"
                            class="hidden mt-2 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>


                <div>
                    <label for="description"
                        class="block mb-1 font-medium text-gray-700 dark:text-black">Description</label>
                    <input type="text" id="description"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div>
                    <label for="amount" class="block mb-1 font-medium text-gray-700 dark:text-black">Amount
                        (Rs.)</label>
                    <input type="number" id="amount"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div class="md:col-span-4 text-right">
                    <button type="submit"
                        class="bg-green-500 text-white px-6 py-2 rounded-lg shadow hover:bg-green-600 transition">Add
                        Expense</button>
                </div>
            </form>
        </div>

        <!-- Expense Table -->
        <div class="bg-white shadow-lg rounded-2xl overflow-hidden mb-6">
            <h2 class="text-lg font-semibold text-white bg-gray-700 p-3 rounded-t-lg">Expense List</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="px-4 py-2 text-left">Date</th>
                            <th class="px-4 py-2 text-left">Category</th>
                            <th class="px-4 py-2 text-left">Description</th>
                            <th class="px-4 py-2 text-left">Amount (Rs.)</th>
                            <th class="px-4 py-2 text-left">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200" id="expense-table">
                        <!-- Expenses will appear here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Summary -->
        <div class="bg-white shadow-lg rounded-2xl overflow-hidden">
            <h2 class="text-lg font-semibold text-white bg-green-400 p-3 rounded-t-lg">Summary</h2>
            <div class="p-4">
                <p class="text-lg">Total: <span class="font-bold text-green-600">Rs.<span id="total">0</span></span></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
