<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- Custom CSS (load last so it overrides others) -->
    <link rel="stylesheet" href="./assets/styles/styles.css">
</head>

<body class="bg-gray-100">

    <div class="container my-5">
        <h1 class="text-center text-3xl font-bold mb-4 text-blue-600">💰 Personal Expense Tracker</h1>

        <!-- Add Expense Form -->
        <div class="card shadow-lg mb-4 rounded-2xl">
            <div class="card-header bg-blue-500 text-white font-semibold">Add New Expense</div>
            <div class="card-body">
                <form id="expense-form" class="row g-3">
                    <div class="col-md-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="text" id="date" class="form-control" placeholder="Select date" required>
                    </div>

                    <div class="col-md-3">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" class="form-select" required>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Medical">Medical</option>
                            <option value="University">University</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="text" id="other-category" class="form-control mt-2 hidden"
                            placeholder="Enter custom category">
                    </div>

                    <div class="col-md-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" id="description" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label for="amount" class="form-label">Amount (Rs.)</label>
                        <input type="number" id="amount" class="form-control" required>
                    </div>

                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success px-4 py-2 rounded-lg shadow">Add Expense</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Expense Table -->
        <div class="card shadow-lg mb-4 rounded-2xl">
            <div class="card-header bg-gray-700 text-white font-semibold">Expense List</div>
            <div class="card-body">
                <table class="table table-striped" id="expense-table">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount (Rs.)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Expenses will be added here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Summary -->
        <div class="card shadow-lg rounded-2xl">
            <div class="card-header bg-green-400 text-white font-semibold">Summary</div>
            <div class="card-body">
                <h5 class="text-lg">
                    Total: <span class="font-bold text-green-600">Rs.<span id="total">0</span></span>
                </h5>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
